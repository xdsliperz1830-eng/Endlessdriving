name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/nightshift-game-8tggfp
      - main
  workflow_dispatch:

# Least privilege needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  # Kept separate from the deploy so that the github-pages environment is only
  # engaged when there is genuinely something to publish. A job that names an
  # environment waits on that environment before it runs a single step, which
  # hangs indefinitely when Pages is not set up for the repository.
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check that Pages is available
        # Pages has to be switched on by a repository admin; a workflow's own
        # GITHUB_TOKEN is not allowed to create the site. Report what is
        # actually configured so a skipped deploy explains itself.
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! cfg=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages is not enabled"
              echo
              echo "Nothing was published. Turn Pages on at **Settings → Pages**"
              echo "and set **Source** to **GitHub Actions**, then re-run this"
              echo "workflow. Note that Pages only serves *private* repositories"
              echo "on a paid plan."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GitHub Pages is not enabled - skipping deploy."
            exit 0
          fi

          build_type=$(echo "$cfg" | jq -r '.build_type // "legacy"')
          site_url=$(echo "$cfg" | jq -r '.html_url // "unknown"')
          echo "Pages is enabled. build_type=$build_type url=$site_url"

          if [ "$build_type" = "workflow" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" \
                 -f 'build_type=workflow' >/dev/null 2>&1; then
            echo "Switched the Pages source from '$build_type' to GitHub Actions."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            # Pages is serving the branch directly. That already publishes the
            # game, so leave it alone rather than fighting over the source.
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Pages is building from a branch, not from Actions"
              echo
              echo "The site is published at <$site_url> by GitHub's own"
              echo "branch build, so this workflow has nothing to do."
              echo
              echo "To publish through this workflow instead, set"
              echo "**Settings → Pages → Source** to **GitHub Actions**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Pages builds from a branch ($build_type); the site is at $site_url. Skipping the Actions deploy."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        # The game is one self-contained file; publish just that rather than
        # serving the README and workflow alongside it.
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
