name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/nightshift-game-8tggfp
      - main
  workflow_dispatch:

# Least privilege needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement turns Pages on automatically the first time this runs,
        # so the site can go live without visiting repository settings.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        # The game is one self-contained file; publish just that rather than
        # serving the README and workflow alongside it.
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
