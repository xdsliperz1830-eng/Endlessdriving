name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/nightshift-game-8tggfp
      - main
  workflow_dispatch:

# Least privilege needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  # Kept separate from the deploy so that the github-pages environment is only
  # engaged when there is genuinely something to publish. A job that names an
  # environment waits on that environment before it runs a single step, which
  # hangs indefinitely when Pages is not set up for the repository.
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check that Pages is available
        # Pages cannot be turned on from a workflow for every repository (a
        # private repository on a free plan cannot use Pages at all), so try to
        # enable it and, if that is not permitted, report why rather than
        # failing the run with an opaque API error.
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "Pages is already enabled."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif gh api -X POST "repos/$GITHUB_REPOSITORY/pages" \
                 -f 'build_type=workflow' >/dev/null 2>&1; then
            echo "Pages was not enabled; enabled it for this repository."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages is not enabled"
              echo
              echo "Nothing was published, because Pages is off for this"
              echo "repository and this workflow is not permitted to turn it on."
              echo
              echo "- GitHub Pages only serves **private** repositories on a paid"
              echo "  plan. If this repository is private on a free account, make"
              echo "  it public under **Settings → General → Change visibility**."
              echo "- Then set **Settings → Pages → Source** to **GitHub Actions**."
              echo
              echo "Re-run this workflow afterwards and the site will deploy."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GitHub Pages is not enabled for this repository - skipping deploy. See the run summary."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        # The game is one self-contained file; publish just that rather than
        # serving the README and workflow alongside it.
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
